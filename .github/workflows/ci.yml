name: Pull Request Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  check-paths:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      aspnet-classic: ${{ steps.filter.outputs.aspnet-classic }}
    steps:
      # Required for push events; pull_request events use the GitHub API directly
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '!(docs/**)'
            aspnet-classic:
              - 'examples/Examples.AspNetClassicWebApi/**'
              - 'src/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.github/workflows/ci.yml'

  unit-tests-windows:
    name: Windows Tests
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    runs-on:
      group: elastic-otel-dotnet
      labels: elastic-otel-dotnet-windows2025-16
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: ./.github/workflows/bootstrap

      - name: Unit Tests
        run: build.bat test --test-suite=unit
        shell: cmd

  unit-tests-linux:
    name: Linux Tests
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    runs-on:
      group: elastic-otel-dotnet
      labels: elastic-otel-dotnet-ubuntu24-16
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: ./.github/workflows/bootstrap
        
      - name: Unit Tests
        run: ./build.sh test --test-suite=unit

  integration-tests-windows:
    name: Windows Integration Tests
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    runs-on:
      group: elastic-otel-dotnet
      labels: elastic-otel-dotnet-windows2025-16
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: ./.github/workflows/bootstrap

      - name: Build Redistributable Artifacts
        run: build.bat redistribute
        shell: cmd

      - name: Integration Tests
        run: build.bat test --test-suite=integration --skip-build --skip-restore
        shell: cmd

  integration-tests-linux:
    name: Linux Integration Tests
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    runs-on:
      group: elastic-otel-dotnet
      labels: elastic-otel-dotnet-ubuntu24-16
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: ./.github/workflows/bootstrap

      - name: Build Redistributable Artifacts
        run: ./build.sh redistribute

      - name: Integration Tests
        run: ./build.sh test --test-suite=integration --skip-build --skip-restore

  aspnet-classic-example-windows:
    name: ASP.NET Classic Example Build
    needs: [check-paths]
    if: needs.check-paths.outputs.aspnet-classic == 'true'
    runs-on:
      group: elastic-otel-dotnet
      labels: elastic-otel-dotnet-windows2025-16
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: ./.github/workflows/bootstrap

      # The example is a legacy (non-SDK) web project that is not part of Elastic.OpenTelemetry.slnx.
      # It requires Visual Studio's MSBuild and web targets, so `dotnet build` can't be used.
      - name: Build ASP.NET Classic Example
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found on the runner." }
          & $msbuild examples/Examples.AspNetClassicWebApi/Examples.AspNetClassicWebApi.csproj -restore -p:Configuration=Release -warnaserror -nologo -v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  aot-tests-windows:
    name: AOT Compatibility Tests
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    runs-on:
      group: elastic-otel-dotnet
      labels: elastic-otel-dotnet-windows2025-16
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: ./.github/workflows/bootstrap

      - name: AOT Compatibility Tests
        run: build.bat test --test-suite=aot_compatibility
        shell: cmd

  build-verification-linux:
    name: Build Verification Tests
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    runs-on:
      group: elastic-otel-dotnet
      labels: elastic-otel-dotnet-ubuntu24-16
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: ./.github/workflows/bootstrap

      - name: Build Redistributable Artifacts
        run: ./build.sh redistribute

      - name: Build Verification Tests
        run: ./build.sh test --test-suite=build_verification --skip-build --skip-restore